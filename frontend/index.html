<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>文件预览</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Cpath d='M9 8h9l5 5v11H9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M18 8v5h5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>文件预览</h1>
            <p id="host-context" class="host-context">正在读取宿主上下文…</p>
          </div>
        </div>
        <div class="actions">
          <button id="pick" type="button" class="primary">打开文件</button>
          <button id="clear" type="button">清空</button>
        </div>
      </header>

      <section id="dropzone" class="dropzone">
        <p class="dropzone-title">拖拽任意格式文件到此处</p>
        <p class="dropzone-hint">支持 DWG/DXF 图纸、3D 模型、PDF、Office 文档、图片、音视频、代码与压缩包</p>
        <div id="formats" class="formats"></div>
      </section>

      <section id="workspace" class="workspace" hidden>
        <div class="toolbar">
          <span id="file-name" class="file-name"></span>
          <span id="file-meta" class="file-meta"></span>
          <div class="spacer"></div>
          <span id="renderer" class="renderer"></span>
          <a id="download" class="download" download>下载</a>
        </div>
        <div class="file-workbench">
          <aside id="file-browser" class="file-browser" aria-label="已打开文件">
            <input id="file-filter" type="search" placeholder="筛选文件…" aria-label="筛选文件" />
            <div id="file-list" class="file-list"></div>
          </aside>
          <div id="stage" class="stage"></div>
        </div>
      </section>

      <details id="history-panel" class="history-panel" open>
        <summary>浏览历史 · 保存 30 天</summary>
        <p class="history-hint">文件副本保存在 AIO，按账号隔离。单文件最多 4 MiB，最多 100 条 / 256 MiB；过期或超限自动移除。清空当前工作区不会删除历史。</p>
        <div class="viewer-toolbar">
          <input id="history-filter" type="search" placeholder="筛选浏览历史…" aria-label="筛选浏览历史" />
          <button id="history-clear" type="button">删除全部历史</button>
          <span id="history-status" class="file-meta" role="status"></span>
        </div>
        <div id="history-list" class="history-list"></div>
      </details>
      <p id="note" class="note"></p>
      <p id="error" class="error" role="alert"></p>
    </div>
    <dialog id="clear-dialog" aria-labelledby="clear-title">
      <h2 id="clear-title">清空文件和草稿？</h2>
      <p>还有未下载的修改，清空后无法恢复。</p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>保留草稿</button>
        <button value="clear">清空全部</button>
      </form>
    </dialog>
    <dialog id="history-delete-dialog" aria-labelledby="history-delete-title">
      <h2 id="history-delete-title">删除浏览历史？</h2>
      <p>记录及保存的文件副本会一起删除，当前打开的文件不受影响。</p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>取消</button>
        <button value="delete">确认删除</button>
      </form>
    </dialog>
    <input id="file-input" type="file" multiple hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
