[package]
name = "aio-plugin-preview"
version = "0.1.10"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
topcoat = { version = "0.6.2", default-features = false, features = ["discover", "router", "serve", "view"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
